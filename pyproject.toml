[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-master-e3-p2"
version = "0.1.0"
description = "Truthful spatial routing overlays and a reproducible demo for YOLO-Master E3 P2"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

